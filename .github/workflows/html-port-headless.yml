name: Native HTML port headless checks
on:
  push:
    branches: [native-apk-reverse-engineering]
    paths: ['research/phase23/**', '.github/workflows/html-port-headless.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Selection and power unit tests
        run: node --test research/phase21/selection.test.cjs research/phase22/striker.test.cjs research/phase22/power.test.cjs
      - name: Runtime regressions on the browser port
        run: node research/phase22/runtime.test.cjs research/phase23/fixture.html
      - name: Real headless Chromium
        run: node research/phase23/headless.test.cjs research/phase23/fixture.html
