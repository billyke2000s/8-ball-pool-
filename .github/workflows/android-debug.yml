name: Android debug APK
on:
  push:
    branches: [main]
    paths: ['android/**', 'docs/**', 'tests/**', '.github/workflows/android-debug.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test pool game state and two-player sync
        run: node --test tests/*.test.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Ubuntu runners include Android cmdline-tools, but sdkmanager is not on PATH.
      # The retired 'tools' SDK package is not available on current SDK indexes.
      - name: Find Android SDK manager
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then echo 'No Android sdkmanager found'; exit 1; fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install SDK
        run: '"$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"'
      - name: Build debug APK
        run: gradle -p android --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: 8-ball-pool-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
