name: Release Android APK
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Test, build and publish APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run billiards game and multiplayer tests
        run: node --test tests/*.test.cjs

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's ubuntu-latest runners already include the Android command-line SDK.
      # android-actions/setup-android@v3 attempts to install removed package 'tools'.
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --version

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Compile installable Android APK
        run: gradle -p android --no-daemon --stacktrace assembleDebug

      - name: Name APK for download
        run: cp android/app/build/outputs/apk/debug/app-debug.apk 8-Ball-Pool-v0.1.0-preview.apk

      - name: Upload APK as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: 8-Ball-Pool-v0.1.0-preview
          path: 8-Ball-Pool-v0.1.0-preview.apk
          if-no-files-found: error

      - name: Publish preview APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.0-preview.1 8-Ball-Pool-v0.1.0-preview.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "8 Ball Pool v0.1.0 — Android preview" \
            --notes-file RELEASE_NOTES.md \
            --prerelease
