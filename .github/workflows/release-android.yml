name: Release Android APK
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Test, build and publish APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run billiards game and multiplayer tests
        run: node --test tests/*.test.cjs

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Ubuntu runners include Android cmdline-tools, but sdkmanager is not on PATH.
      # The retired 'tools' SDK package is not available on current SDK indexes.
      - name: Find Android SDK manager
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then echo 'No Android sdkmanager found'; exit 1; fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android platform
        run: '"$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"'

      - name: Compile installable Android APK
        run: gradle -p android --no-daemon --stacktrace assembleDebug

      - name: Name APK for download
        run: cp android/app/build/outputs/apk/debug/app-debug.apk 8-Ball-Pool-v0.1.0-preview.apk

      - name: Upload APK as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: 8-Ball-Pool-v0.1.0-preview
          path: 8-Ball-Pool-v0.1.0-preview.apk
          if-no-files-found: error

      - name: Publish preview APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.0-preview.1 8-Ball-Pool-v0.1.0-preview.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "8 Ball Pool v0.1.0 — Android preview" \
            --notes-file RELEASE_NOTES.md \
            --prerelease
